plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.raphael.code'
    compileSdk 34

    defaultConfig {
        applicationId "com.raphael.code"
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    // Sabit imza: her derlemede aynı anahtar -> APK'yı silmeden üstüne güncelleyebilirsin (sohbetler korunur)
    signingConfigs {
        debug {
            storeFile file('raphael.keystore')
            storePassword 'raphael123'
            keyAlias 'raphael'
            keyPassword 'raphael123'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
