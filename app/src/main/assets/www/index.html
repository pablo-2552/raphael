<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Raphael Code</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-mode="chat">
<div id="app">
  <header id="top">
    <button id="btnMenu" class="ib" aria-label="Sohbetler"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <div id="seg" data-m="chat"><i></i><button data-m="chat" class="on">Sohbet</button><button data-m="agent">✦ Raphael</button></div>
    <button id="btnSet" class="ib" aria-label="Ayarlar"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  </header>
  <div id="run" class="hide"><span class="spin"></span><span class="rt"></span><b class="lv" data-t0="0"></b></div>
  <main id="msgs"></main>
  <button id="toBottom" class="hide" aria-label="Aşağı"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
  <footer id="comp">
    <div id="pal" class="hide"></div>
    <div id="chips"></div>
    <div id="box">
      <textarea id="inp" rows="1" placeholder="Mesaj yaz veya / ile komut…" enterkeyhint="send" autocomplete="off" autocapitalize="sentences"></textarea>
      <button id="send" aria-label="Gönder"></button>
    </div>
  </footer>
</div>
<div id="scrim" class="hide"></div>
<aside id="drawer"></aside>
<section id="settings"></section>
<div id="modal" class="hide"></div>
<div id="toast"></div>
<script src="js/core.js"></script>
<script src="js/llm.js"></script>
<script src="js/agent.js"></script>
<script src="js/agentsetup.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
